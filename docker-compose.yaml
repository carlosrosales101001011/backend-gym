services:
  db:
    image: postgres:18.1-alpine3.23
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_HOST_AUTH_METHOD: trust
    container_name: restaurante_db
    volumes:
    - ./postgres:/var/lib/postgresql